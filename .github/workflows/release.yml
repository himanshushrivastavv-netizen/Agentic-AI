name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Standalone Binary
    runs-on: windows-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Windows Executable (.exe)
        run: |
          pyinstaller --noconsole --onefile --name "AgenticAI" main.py

      - name: Publish GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgenticAI.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
